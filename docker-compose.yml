services:
  app:
    build: .
    restart: unless-stopped
    environment:
      # Shared secret the qr-certificates server sends as X-API-Key.
      DOCX_API_KEY: ${DOCX_API_KEY:?Set DOCX_API_KEY in .env}
      ALLOWED_IMAGE_HOSTS: ${ALLOWED_IMAGE_HOSTS:-cddlqldwjnpwwnpjqxhp.supabase.co}
    ports:
      - "8000:8000"
    volumes:
      - ./templates:/app/templates
      - ./generated_docs:/app/generated_docs
      - ./db:/app/db
      - ./app:/app/app
    dns:
      - 8.8.8.8
      - 1.1.1.1

volumes:
  templates:
  generated_docs:
  db_data: 